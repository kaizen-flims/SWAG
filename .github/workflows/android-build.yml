name: Android build

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - ".github/workflows/android-build.yml"
      - "scripts/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Android Rust targets
        run: rustup target add aarch64-linux-android armv7-linux-androideabi i686-linux-android x86_64-linux-android

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Install Android SDK packages
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "Android SDK command-line tools were not found under $SDK_ROOT" >&2
            exit 1
          fi
          "$SDKMANAGER" --version
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses || true
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" --channel=3 --install \
            "platform-tools" \
            "platforms;android-37.1" \
            "build-tools;37.0.0" \
            "cmake;3.22.1" \
            "ndk;27.2.12479018"

      - name: Restore required upstream Android libraries
        run: bash scripts/restore-android-libs.sh

      - name: Generate #SWAG Android branding assets
        run: |
          python3 -m venv .icon-venv
          . .icon-venv/bin/activate
          python -m pip install --disable-pip-version-check cairosvg pillow
          python scripts/generate-android-icons.py

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build #SWAG Android full debug APK
        working-directory: app
        run: ./gradlew --no-daemon :androidApp:assembleFullDebug

      - name: Smoke test app launch on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -no-metrics
          disable-linux-hw-accel: true
          emulator-boot-timeout: 900
          script: bash "$GITHUB_WORKSPACE/scripts/smoke-test-android.sh"

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: swag-android-full-debug
          path: app/androidApp/build/outputs/apk/full/debug/*.apk
          if-no-files-found: error
          retention-days: 7
