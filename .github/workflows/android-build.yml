name: Android build

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - ".github/workflows/android-build.yml"
      - "scripts/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Android Rust targets
        run: rustup target add aarch64-linux-android armv7-linux-androideabi i686-linux-android x86_64-linux-android

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Install Android SDK packages
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "Android SDK command-line tools were not found under $SDK_ROOT" >&2
            exit 1
          fi
          "$SDKMANAGER" --version
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses || true
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" --channel=3 --install \
            "platform-tools" \
            "platforms;android-37.1" \
            "build-tools;37.0.0" \
            "cmake;3.22.1" \
            "ndk;27.2.12479018"

      - name: Restore required upstream Android libraries
        run: bash scripts/restore-android-libs.sh

      - name: Generate #SWAG Android branding assets
        run: |
          python3 -m venv .icon-venv
          . .icon-venv/bin/activate
          python -m pip install --disable-pip-version-check cairosvg pillow
          python scripts/generate-android-icons.py

      - name: Audit legacy-named Kotlin declarations
        run: python3 scripts/audit-obsolete-kotlin.py

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Configure permanent SWAG release signing
        env:
          SWAG_RELEASE_KEYSTORE_BASE64: ${{ secrets.SWAG_RELEASE_KEYSTORE_BASE64 }}
          SWAG_RELEASE_STORE_PASSWORD: ${{ secrets.SWAG_RELEASE_STORE_PASSWORD }}
          SWAG_RELEASE_KEY_ALIAS: ${{ secrets.SWAG_RELEASE_KEY_ALIAS }}
          SWAG_RELEASE_KEY_PASSWORD: ${{ secrets.SWAG_RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in \
            SWAG_RELEASE_KEYSTORE_BASE64 \
            SWAG_RELEASE_STORE_PASSWORD \
            SWAG_RELEASE_KEY_ALIAS \
            SWAG_RELEASE_KEY_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "Required GitHub Actions secret is missing: $name" >&2
              exit 1
            fi
          done

          KEYSTORE_PATH="$RUNNER_TEMP/swag-release.jks"
          printf '%s' "$SWAG_RELEASE_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          chmod 600 "$KEYSTORE_PATH"

          keytool -list -keystore "$KEYSTORE_PATH" \
            -storepass "$SWAG_RELEASE_STORE_PASSWORD" \
            -alias "$SWAG_RELEASE_KEY_ALIAS" >/dev/null

          cat > app/local.properties <<EOF
          NUVIO_RELEASE_STORE_FILE=$KEYSTORE_PATH
          NUVIO_RELEASE_STORE_PASSWORD=$SWAG_RELEASE_STORE_PASSWORD
          NUVIO_RELEASE_KEY_ALIAS=$SWAG_RELEASE_KEY_ALIAS
          NUVIO_RELEASE_KEY_PASSWORD=$SWAG_RELEASE_KEY_PASSWORD
          EOF
          chmod 600 app/local.properties

      - name: Verify Nuvio backend configuration
        env:
          NUVIO_SUPABASE_URL: ${{ secrets.NUVIO_SUPABASE_URL }}
          NUVIO_SUPABASE_ANON_KEY: ${{ secrets.NUVIO_SUPABASE_ANON_KEY }}
          NUVIO_SUPABASE_FALLBACK_URL: ${{ secrets.NUVIO_SUPABASE_FALLBACK_URL }}
        run: |
          set -euo pipefail
          for name in NUVIO_SUPABASE_URL NUVIO_SUPABASE_ANON_KEY; do
            if [ -z "${!name:-}" ]; then
              echo "Required GitHub Actions secret is missing: $name" >&2
              exit 1
            fi
          done
          case "$NUVIO_SUPABASE_URL" in
            https://*) ;;
            *) echo "NUVIO_SUPABASE_URL must use HTTPS." >&2; exit 1 ;;
          esac

      - name: Build #SWAG universal signed release APK only
        working-directory: app
        env:
          NUVIO_SUPABASE_URL: ${{ secrets.NUVIO_SUPABASE_URL }}
          NUVIO_SUPABASE_ANON_KEY: ${{ secrets.NUVIO_SUPABASE_ANON_KEY }}
          NUVIO_SUPABASE_FALLBACK_URL: ${{ secrets.NUVIO_SUPABASE_FALLBACK_URL }}
        run: ./gradlew --no-daemon :androidApp:assembleFullRelease

      - name: Verify the single universal release APK
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          APKSIGNER="$SDK_ROOT/build-tools/37.0.0/apksigner"
          APK="app/androidApp/build/outputs/apk/full/release/androidApp-full-release.apk"
          if [ ! -x "$APKSIGNER" ]; then
            echo "Android apksigner was not found at $APKSIGNER" >&2
            exit 1
          fi
          if [ ! -f "$APK" ]; then
            echo "Universal release APK was not produced: $APK" >&2
            find app/androidApp/build/outputs/apk -maxdepth 4 -type f -name '*.apk' -print || true
            exit 1
          fi
          count="$(find app/androidApp/build/outputs/apk/full/release -maxdepth 1 -type f -name '*.apk' | wc -l)"
          if [ "$count" -ne 1 ]; then
            echo "Expected exactly one release APK, found $count." >&2
            exit 1
          fi
          "$APKSIGNER" verify --verbose "$APK"

      # Emulator smoke tests are intentionally opt-in. Re-enable when investigating a runtime regression.

      - name: Upload the universal signed release APK
        uses: actions/upload-artifact@v7
        with:
          name: swag-universal-release
          path: app/androidApp/build/outputs/apk/full/release/androidApp-full-release.apk
          if-no-files-found: error
          retention-days: 30
