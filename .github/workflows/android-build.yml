name: Android build

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - ".github/workflows/android-build.yml"
      - "scripts/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Android Rust targets
        run: rustup target add aarch64-linux-android armv7-linux-androideabi i686-linux-android x86_64-linux-android

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Install Android SDK packages
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "Android SDK command-line tools were not found under $SDK_ROOT" >&2
            exit 1
          fi
          "$SDKMANAGER" --version
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses || true
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" --channel=3 --install \
            "platform-tools" \
            "platforms;android-37.1" \
            "build-tools;37.0.0" \
            "cmake;3.22.1" \
            "ndk;27.2.12479018"

      - name: Restore required upstream Android libraries
        run: bash scripts/restore-android-libs.sh

      - name: Generate #SWAG Android branding assets
        run: |
          python3 -m venv .icon-venv
          . .icon-venv/bin/activate
          python -m pip install --disable-pip-version-check cairosvg pillow
          python scripts/generate-android-icons.py

      - name: Audit legacy-named Kotlin declarations
        run: python3 scripts/audit-obsolete-kotlin.py

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Configure permanent SWAG release signing
        env:
          SWAG_RELEASE_KEYSTORE_BASE64: ${{ secrets.SWAG_RELEASE_KEYSTORE_BASE64 }}
          SWAG_RELEASE_STORE_PASSWORD: ${{ secrets.SWAG_RELEASE_STORE_PASSWORD }}
          SWAG_RELEASE_KEY_ALIAS: ${{ secrets.SWAG_RELEASE_KEY_ALIAS }}
          SWAG_RELEASE_KEY_PASSWORD: ${{ secrets.SWAG_RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in \
            SWAG_RELEASE_KEYSTORE_BASE64 \
            SWAG_RELEASE_STORE_PASSWORD \
            SWAG_RELEASE_KEY_ALIAS \
            SWAG_RELEASE_KEY_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "Required GitHub Actions secret is missing: $name" >&2
              exit 1
            fi
          done

          KEYSTORE_PATH="$RUNNER_TEMP/swag-release.jks"
          printf '%s' "$SWAG_RELEASE_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          chmod 600 "$KEYSTORE_PATH"

          keytool -list -keystore "$KEYSTORE_PATH" \
            -storepass "$SWAG_RELEASE_STORE_PASSWORD" \
            -alias "$SWAG_RELEASE_KEY_ALIAS" >/dev/null

          cat > app/local.properties <<EOF
          NUVIO_RELEASE_STORE_FILE=$KEYSTORE_PATH
          NUVIO_RELEASE_STORE_PASSWORD=$SWAG_RELEASE_STORE_PASSWORD
          NUVIO_RELEASE_KEY_ALIAS=$SWAG_RELEASE_KEY_ALIAS
          NUVIO_RELEASE_KEY_PASSWORD=$SWAG_RELEASE_KEY_PASSWORD
          EOF
          chmod 600 app/local.properties

      - name: Build #SWAG Android full debug and signed release APKs
        working-directory: app
        run: ./gradlew --no-daemon :androidApp:assembleFullDebug :androidApp:assembleFullRelease

      - name: Verify signed release APKs
        run: |
          set -euo pipefail
          shopt -s nullglob
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          APKSIGNER="$SDK_ROOT/build-tools/37.0.0/apksigner"
          if [ ! -x "$APKSIGNER" ]; then
            echo "Android apksigner was not found at $APKSIGNER" >&2
            exit 1
          fi
          apks=(app/androidApp/build/outputs/apk/full/release/*.apk)
          if [ ${#apks[@]} -eq 0 ]; then
            echo "No full-release APKs were produced." >&2
            exit 1
          fi
          for apk in "${apks[@]}"; do
            "$APKSIGNER" verify --verbose "$apk"
          done

      - name: Smoke test app launch on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -no-metrics
          disable-linux-hw-accel: true
          emulator-boot-timeout: 900
          script: bash "$GITHUB_WORKSPACE/scripts/smoke-test-android.sh"

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: swag-android-full-debug
          path: app/androidApp/build/outputs/apk/full/debug/*.apk
          if-no-files-found: error
          retention-days: 7

      - name: Upload permanently signed release APKs
        uses: actions/upload-artifact@v7
        with:
          name: swag-android-full-release
          path: app/androidApp/build/outputs/apk/full/release/*.apk
          if-no-files-found: error
          retention-days: 30
